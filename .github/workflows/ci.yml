name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes any in-flight run for it obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Kept as separate steps so a failure names the gate that broke, and so a
      # lint failure does not hide a type error behind it.
      - name: Lint
        run: bun run lint

      # Bun strips types rather than checking them, so this is the only thing
      # standing between a type error and main.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
